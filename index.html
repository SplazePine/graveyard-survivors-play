<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Graveyard Survivors - a spooky pixel game you can play inside an X post</title>

<!-- ===== X (Twitter) PLAYER CARD =====
     X reads these tags when someone posts a link to THIS page.
     All links point to the live address https://splazepine.github.io/graveyard-survivors-play/
     They must be full https:// links, because X does not run JavaScript.
     ?v=1 everywhere: when you change something, bump ALL of them to ?v=2 (X and browsers cache). -->
<meta name="twitter:card" content="player">
<meta name="twitter:title" content="Graveyard Survivors 🎃 Survive the night">
<meta name="twitter:description" content="Pick a Gravekeeper, survive 3 rounds of monsters, and beat Big Beelz. Play it right here in the post.">
<meta name="twitter:image" content="https://splazepine.github.io/graveyard-survivors-play/card.png?v=1">
<meta name="twitter:image:alt" content="Pixel art: Mort the gravedigger and Granny Wicklow in a moonlit graveyard, facing Big Beelz, a horned pumpkin demon">
<meta name="twitter:player" content="https://splazepine.github.io/graveyard-survivors-play/game.html?v=1">
<meta name="twitter:player:width" content="480">
<meta name="twitter:player:height" content="480">

<!-- Open Graph tags: other apps (Discord, iMessage, etc.) read these -->
<meta property="og:type" content="website">
<meta property="og:title" content="Graveyard Survivors 🎃 Survive the night">
<meta property="og:description" content="A spooky pixel Survivors game: 3 rounds, 3 mini bosses, and Big Beelz.">
<meta property="og:image" content="https://splazepine.github.io/graveyard-survivors-play/card.png?v=1">
<meta property="og:url" content="https://splazepine.github.io/graveyard-survivors-play/?v=1">

<style>
  html,body{margin:0;height:100%;background:#140c1c;color:#f4f0e8;font:16px system-ui,sans-serif}
  main{max-width:520px;margin:0 auto;padding:24px 16px;text-align:center}
  h1{color:#ffa43a}
  .frame{width:100%;max-width:480px;aspect-ratio:1;border:0;border-radius:12px;background:#000}
</style>
</head>
<body>
<main>
  <h1>Graveyard Survivors 🎃</h1>
  <p>Move with WASD, the arrow keys, by holding the mouse, or by dragging on a phone. Your Gravekeeper attacks by themself.</p>
  <!-- People who open the link in a normal browser still get to play. -->
  <iframe class="frame" src="game.html?v=1" title="Graveyard Survivors game"
          sandbox="allow-popups allow-same-origin allow-scripts allow-presentation"></iframe>
  <p><a href="game.html?v=1" target="_blank" rel="noopener" style="color:#9b6ad6">Open full screen ↗</a></p>
</main>
</body>
</html>
