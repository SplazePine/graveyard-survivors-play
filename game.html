  const im = new Image(); im.decoding = "async"; IMG_STATE[k] = "loading";

  for (const [k, [x, y, w, h]] of Object.entries(ART.paint[sheet])) {

// ---- the logo: our pixel font rebuilt as soft blobs, with drips, a bone-to-ember fill, a dark rim and a glow ----
